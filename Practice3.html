<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="practice1.css">
    <title>Practice3</title>
    <script src="password_manager.js"></script>
</head>
<body>
    <h2>
        Password Checker
    </h2>

    <div class="password_holder">
        <p>
            enter password
        </p>

        <form input="text">
            <input type="password" id="password_first_attempt">
        </form>
    </div>

    <div class="password_holder">
        <p>
            re-enter password
        </p>
        
        <form input="text">
            <input type="password" id="password_second_attempt">
        </form>
    </div>

    <button id="password_try_button" type="button">
        try password
    </button>

    <p id="password_text_check">
        
    </p>
</body>
</html>
